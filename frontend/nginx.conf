# IP do cliente: vem do proxy de borda (X-Real-IP). Este Nginx não é publicado, só o proxy fala com ele.
map $http_x_real_ip $client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    client_max_body_size 12m;   # upload de logo e fotos

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker: o nome "backend" é resolvido a cada requisição, não na partida. Assim o Nginx sobe
    # mesmo que o backend ainda esteja iniciando (ou reiniciando) e responde 502 até ele ficar pronto.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API e Django admin: encaminhados ao backend (único ponto de entrada; o backend não é publicado).
    location ~ ^/(api|admin)/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Arquivos do Django admin e imagens enviadas (volumes compartilhados com o backend).
    location /static/ { alias /data/static/; expires 7d; }
    location /media/  { alias /data/media/;  expires 1d; }

    # Arquivos do Vite têm hash no nome: cache longo.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    # Qualquer outra rota cai no React (ex.: /?empresa=slug).
    location / { try_files $uri /index.html; }
}
